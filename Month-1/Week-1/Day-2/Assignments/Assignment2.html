<html>
<head>
    <style>
        table td tr{
            border-color: black;
            border-style: solid;
            border-collapse: collapse;
            border-spacing: 5px;
            border-width: 2px;    
        }
    </style>
</head>
<body>
<table border= "5px" cellspacing="4" >
            <caption>CSS3 Browser Support (latest browser versions)</caption>
            <tr>
                <th>CSS Property</th>
                <th>Internet Explorer</th>
                <th>FireFox</th>
                <th>Chrome</th>
                <th>Safari</th>
                <th>Opera</th>
            </tr>
            <tr>
                <td><b>Border Radius</b></td>
                <td align="center">YES</td>
                <td align="center">YES</td>
                <td align="center">YES</td>
                <td align="center">YES</td>
                <td align="center">YES</td>
            </tr>
            <tr>
                <td><b>Box Shadow</b></td>
                <td align="center">YES</td>
                <td align="center">YES</td>
                <td align="center">YES</td>
                <td align="center">YES</td>
                <td align="center">YES</td>
            </tr>
            <tr>
                <td><b>CSS Animations</b></td>
                <td align="center">NO</td>
                <td align="center">NO</td>
                <td align="center">YES</td>
                <td align="center">YES</td>
                <td align="center">NO</td>
            </tr>
        </table>


</body>
</html>
